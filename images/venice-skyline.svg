<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Illustration of the Venice skyline at dusk with a gondola">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf1d9"/>
      <stop offset=".55" stop-color="#f7d9a4"/>
      <stop offset="1" stop-color="#f0b57e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#20776c"/>
    </linearGradient>
    <pattern id="palina" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(70)">
      <rect width="12" height="12" fill="#f6efe4"/>
      <rect width="6" height="12" fill="#c41e3a"/>
    </pattern>
  </defs>

  <rect width="800" height="228" fill="url(#sky)"/>
  <circle cx="565" cy="118" r="42" fill="#e9c46a" opacity=".9"/>

  <!-- distant skyline -->
  <g fill="#8a4a54" opacity=".35">
    <rect x="0" y="198" width="800" height="30"/>
    <rect x="330" y="178" width="26" height="50"/>
    <rect x="384" y="186" width="40" height="42"/>
    <ellipse cx="368" cy="180" rx="12" ry="8"/>
  </g>

  <!-- main silhouette -->
  <g fill="#5b2333">
    <!-- campanile di San Marco -->
    <rect x="84" y="86" width="30" height="142"/>
    <rect x="80" y="118" width="38" height="6"/>
    <polygon points="78,86 99,46 120,86"/>
    <circle cx="99" cy="42" r="4" fill="#e9c46a"/>
    <rect x="90" y="94" width="5" height="14" fill="#f7d9a4"/>
    <rect x="100" y="94" width="5" height="14" fill="#f7d9a4"/>

    <!-- basilica -->
    <rect x="150" y="176" width="130" height="52"/>
    <ellipse cx="215" cy="172" rx="34" ry="26"/>
    <ellipse cx="168" cy="182" rx="18" ry="14"/>
    <ellipse cx="262" cy="182" rx="18" ry="14"/>
    <rect x="213" y="136" width="4" height="14"/>
    <circle cx="215" cy="133" r="3" fill="#e9c46a"/>

    <!-- palazzo row -->
    <rect x="292" y="158" width="52" height="70"/>
    <rect x="352" y="172" width="44" height="56"/>
    <rect x="404" y="150" width="60" height="78"/>
    <rect x="472" y="168" width="46" height="60"/>

    <!-- Santa Maria della Salute -->
    <rect x="640" y="168" width="112" height="60"/>
    <ellipse cx="696" cy="160" rx="52" ry="40"/>
    <rect x="688" y="106" width="16" height="18"/>
    <ellipse cx="696" cy="104" rx="11" ry="9"/>
    <rect x="694" y="88" width="4" height="10"/>
    <circle cx="696" cy="85" r="3" fill="#e9c46a"/>
    <rect x="756" y="188" width="44" height="40"/>
  </g>

  <!-- lit windows -->
  <g fill="#e9c46a" opacity=".85">
    <rect x="300" y="170" width="7" height="11"/>
    <rect x="316" y="170" width="7" height="11"/>
    <rect x="300" y="192" width="7" height="11"/>
    <rect x="316" y="192" width="7" height="11"/>
    <rect x="360" y="182" width="6" height="10"/>
    <rect x="376" y="182" width="6" height="10"/>
    <rect x="414" y="162" width="7" height="12"/>
    <rect x="430" y="162" width="7" height="12"/>
    <rect x="446" y="162" width="7" height="12"/>
    <rect x="414" y="186" width="7" height="12"/>
    <rect x="446" y="186" width="7" height="12"/>
    <rect x="480" y="180" width="6" height="10"/>
    <rect x="496" y="180" width="6" height="10"/>
    <rect x="660" y="186" width="8" height="14"/>
    <rect x="722" y="186" width="8" height="14"/>
  </g>

  <!-- birds -->
  <g stroke="#5b2333" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round">
    <path d="M470,84 q7,-8 14,0 q7,-8 14,0"/>
    <path d="M516,64 q6,-7 12,0 q6,-7 12,0"/>
  </g>

  <!-- lagoon -->
  <rect y="228" width="800" height="72" fill="url(#water)"/>
  <g stroke="#ffffff" opacity=".25" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40,250 h56"/>
    <path d="M130,268 h44"/>
    <path d="M446,282 h60"/>
    <path d="M640,266 h52"/>
    <path d="M700,246 h44"/>
  </g>
  <g stroke="#e9c46a" stroke-width="4" opacity=".5" stroke-linecap="round" fill="none">
    <path d="M565,238 v10"/>
    <path d="M565,260 v14"/>
    <path d="M565,286 v6"/>
  </g>

  <!-- mooring poles -->
  <rect x="586" y="176" width="11" height="112" rx="5" fill="url(#palina)" stroke="#5b2333" stroke-width="1.5" transform="rotate(4 591 232)"/>
  <rect x="614" y="190" width="10" height="98" rx="5" fill="url(#palina)" stroke="#5b2333" stroke-width="1.5" transform="rotate(-3 619 239)"/>

  <!-- gondola -->
  <g fill="#1a1210">
    <path d="M244,252 L254,240 Q255,251 264,255 Q330,268 396,255 Q405,251 406,240 L416,252 Q410,262 396,265 Q330,277 264,265 Q250,262 244,252 Z"/>
    <rect x="384" y="220" width="7" height="28" rx="3.5"/>
    <circle cx="387.5" cy="213" r="5.5"/>
    <path d="M380,226 L358,266" stroke="#1a1210" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
